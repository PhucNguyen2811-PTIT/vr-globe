<!doctype html>
<html>
  <head>
    <title>PTIT - VR Interactive Globe</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img
          id="earth-texture"
          src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
          crossorigin="anonymous"
        />
        <img
          id="sky-texture"
          src="https://cdn.aframe.io/a-painter/images/sky.jpg"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-sky src="#sky-texture"></a-sky>

      <a-sphere
        id="earth-object"
        class="clickable"
        position="0 1.5 -4"
        radius="1.2"
        src="#earth-texture"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear"
      >
      </a-sphere>

      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="-1 1 1" intensity="0.8"></a-light>

      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls position="0 1.6 0"></a-camera>

        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
      </a-entity>
    </a-scene>

    <script>
      document.querySelector("a-scene").addEventListener("loaded", function () {
        const earth = document.querySelector("#earth-object");
        let isRotating = true;
        let rotationSpeed = 0; // Tốc độ xoay do cần gạt điều khiển

        // 1. CLICK ĐỂ DỪNG/CHẠY (GIỮ NGUYÊN)
        earth.addEventListener("mousedown", function () {
          if (isRotating) {
            earth.components.animation.pause();
            isRotating = false;
          } else {
            earth.components.animation.play();
            isRotating = true;
          }
        });

        // 2. LẮNG NGHE CẦN GẠT (JOYSTICK)
        const controllers = document.querySelectorAll("[laser-controls]");

        controllers.forEach((controller) => {
          controller.addEventListener("axismove", function (evt) {
            // evt.detail.axis[0] là trục ngang của cần gạt (Trái: -1, Phải: 1)
            const joystickX = evt.detail.axis[0];

            if (Math.abs(joystickX) > 0.1) {
              // Nếu gạt đủ mạnh
              rotationSpeed = joystickX * 2; // Điều chỉnh số 2 để tăng/giảm tốc độ xoay
              isRotating = false; // Tạm dừng auto-rotate khi đang điều khiển tay
              earth.components.animation.pause();
            } else {
              rotationSpeed = 0;
            }
          });
        });

        // 3. VÒNG LẶP CẬP NHẬT (Tạo chuyển động mượt mà)
        function tick() {
          if (rotationSpeed !== 0) {
            // Lấy góc xoay hiện tại
            let currentRotation = earth.getAttribute("rotation");
            // Cộng thêm góc mới dựa trên cần gạt
            currentRotation.y += rotationSpeed;
            earth.setAttribute("rotation", currentRotation);
          }
          requestAnimationFrame(tick);
        }
        tick();
      });
    </script>
  </body>
</html>
