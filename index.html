<!doctype html>
<html>
  <head>
    <title>PTIT - VR Interactive Globe</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img
          id="earth-texture"
          src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
          crossorigin="anonymous"
        />
        <img
          id="sky-texture"
          src="https://cdn.aframe.io/a-painter/images/sky.jpg"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-sky src="#sky-texture"></a-sky>

      <a-sphere
        id="earth-object"
        class="clickable"
        position="0 1.5 -4"
        radius="1.2"
        src="#earth-texture"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear"
      >
      </a-sphere>

      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="-1 1 1" intensity="0.8"></a-light>

      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls position="0 1.6 0"></a-camera>

        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
      </a-entity>
    </a-scene>

    <script>
      document.querySelector("a-scene").addEventListener("loaded", function () {
        const earth = document.querySelector("#earth-object");
        const leftHand = document.querySelector(
          '[laser-controls="hand: left"]',
        );
        const rightHand = document.querySelector(
          '[laser-controls="hand: right"]',
        );

        let isAutoRotating = true;

        // 1. CLICK ĐỂ DỪNG/CHẠY TỰ ĐỘNG
        earth.addEventListener("mousedown", function () {
          isAutoRotating = !isAutoRotating;
          if (isAutoRotating) earth.components.animation.play();
          else earth.components.animation.pause();
        });

        // 2. HÀM CẬP NHẬT LIÊN TỤC (TICK)
        function update() {
          // Kiểm tra cả 2 tay cầm xem có cái nào đang gạt cần không
          [leftHand, rightHand].forEach((controller) => {
            const gamepad =
              controller.components["laser-controls"].index !== undefined
                ? navigator.getGamepads()[
                    controller.components["laser-controls"].index
                  ]
                : null;

            if (gamepad && gamepad.axes) {
              // Trục 2 hoặc 3 thường là Joystick ngang trên các dòng kính VR hiện nay
              const joystickX = gamepad.axes[2] || gamepad.axes[0];

              if (Math.abs(joystickX) > 0.1) {
                isAutoRotating = false;
                earth.components.animation.pause();

                // Xoay quả cầu dựa trên độ gạt của cần
                let rotation = earth.getAttribute("rotation");
                rotation.y -= joystickX * 3; // Số 3 là tốc độ xoay tay
                earth.setAttribute("rotation", rotation);
              }
            }
          });
          requestAnimationFrame(update);
        }
        update();
      });
    </script>
  </body>
</html>
