<!doctype html>
<html>
  <head>
    <title>PTIT - VR Interactive Globe</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img
          id="earth-texture"
          src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
          crossorigin="anonymous"
        />
        <img
          id="sky-texture"
          src="https://cdn.aframe.io/a-painter/images/sky.jpg"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-sky src="#sky-texture"></a-sky>

      <a-sphere
        id="earth-object"
        class="clickable"
        position="0 1.5 -4"
        radius="1.2"
        src="#earth-texture"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear"
      >
      </a-sphere>

      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="-1 1 1" intensity="0.8"></a-light>

      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls position="0 1.6 0"></a-camera>

        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
      </a-entity>
    </a-scene>

    <script>
      document.querySelector("a-scene").addEventListener("loaded", function () {
        const earth = document.querySelector("#earth-object");
        let isAutoRotating = true;
        let manualRotationY = 0;

        // 1. CLICK CHUỘT / TRIGGER TAY CẦM (Dừng/Chạy)
        earth.addEventListener("mousedown", function () {
          isAutoRotating = !isAutoRotating;
          if (isAutoRotating) earth.components.animation.play();
          else earth.components.animation.pause();
        });

        // 2. TEST BẰNG PHÍM MŨI TÊN (Giả lập cần gạt trên máy tính)
        window.addEventListener("keydown", (e) => {
          let rot = earth.getAttribute("rotation");
          if (e.key === "ArrowLeft") {
            isAutoRotating = false;
            earth.components.animation.pause();
            rot.y -= 5;
            earth.setAttribute("rotation", rot);
          }
          if (e.key === "ArrowRight") {
            isAutoRotating = false;
            earth.components.animation.pause();
            rot.y += 5;
            earth.setAttribute("rotation", rot);
          }
        });

        // 3. HÀM CẬP NHẬT CHO TAY CẦM VR THẬT (TICK)
        function update() {
          const gamepads = navigator.getGamepads();
          for (const gp of gamepads) {
            if (gp && gp.axes) {
              // Trục 2 hoặc 0 tùy loại kính
              let axisX = gp.axes[2] || gp.axes[0];
              if (Math.abs(axisX) > 0.1) {
                isAutoRotating = false;
                earth.components.animation.pause();
                let rot = earth.getAttribute("rotation");
                rot.y += axisX * 2; // Tốc độ xoay
                earth.setAttribute("rotation", rot);
              }
            }
          }
          requestAnimationFrame(update);
        }
        update();
      });
    </script>
  </body>
</html>
