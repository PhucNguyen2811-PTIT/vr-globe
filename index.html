<!doctype html>
<html>
  <head>
    <title>Interactive Globe - Auto & Manual Rotate</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/aframe-orbit-controls@1.3.2/dist/aframe-orbit-controls.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img
          id="earth-texture"
          src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
          crossorigin="anonymous"
        />
        <img
          id="sky-texture"
          src="https://cdn.aframe.io/a-painter/images/sky.jpg"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-sky src="#sky-texture"></a-sky>

      <a-sphere
        id="earth-object"
        position="0 1.5 -4"
        radius="1.2"
        src="#earth-texture"
      >
      </a-sphere>

      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="-1 1 1" intensity="0.8"></a-light>

      <a-entity
        id="camera"
        camera
        orbit-controls="
          target: 0 1.5 -4;      
          initialPosition: 0 1.5 2;
          minDistance: 2;
          maxDistance: 10;
          rotateSpeed: 2;
          enablePan: false;
          autoRotate: true;           /* Tự động xoay */
          autoRotateSpeed: 0.1;       /* Tốc độ tự xoay (tăng giảm tùy ý) */
          enableDamping: true;        /* Giúp xoay chuột có độ mượt/quán tính */
          dampingFactor: 0.1;
        "
      >
      </a-entity>
    </a-scene>
  </body>
</html>
