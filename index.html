<!doctype html>
<html>
  <head>
    <title>PTIT - VR Interactive Globe</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img
          id="earth-texture"
          src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
          crossorigin="anonymous"
        />
        <img
          id="sky-texture"
          src="https://cdn.aframe.io/a-painter/images/sky.jpg"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-sky src="#sky-texture"></a-sky>

      <a-sphere
        id="earth-object"
        class="clickable"
        position="0 1.5 -4"
        radius="1.2"
        src="#earth-texture"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 25000; easing: linear"
      >
      </a-sphere>

      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="-1 1 1" intensity="0.8"></a-light>

      <a-entity id="rig" position="0 0 0">
        <a-camera look-controls position="0 1.6 0"></a-camera>

        <a-entity
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
        <a-entity
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 10; interval: 100"
        ></a-entity>
      </a-entity>
    </a-scene>

    <script>
      // Đảm bảo Scene đã load xong mới chạy Script
      document.querySelector("a-scene").addEventListener("loaded", function () {
        const earth = document.querySelector("#earth-object");
        let isRotating = true;

        // Lắng nghe cả sự kiện mousedown (cho tay cầm VR) và click (cho chuột máy tính)
        earth.addEventListener("mousedown", function (evt) {
          // Truy cập trực tiếp vào component animation của A-Frame
          const anim = earth.components.animation;

          if (anim) {
            if (isRotating) {
              // Lệnh PAUSE: Dừng ngay tại vị trí hiện tại, không bị nhảy
              anim.pause();
              isRotating = false;
              console.log("Đã dừng");
            } else {
              // Lệnh PLAY: Chạy tiếp từ vị trí đang đứng
              anim.play();
              isRotating = true;
              console.log("Chạy tiếp");
            }
          }
        });
      });
    </script>
  </body>
</html>
