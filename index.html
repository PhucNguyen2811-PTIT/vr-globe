<!doctype html>
<html>
  <head>
    <title>PTIT - VR Globe Final</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-assets>
        <img
          id="earth-texture"
          src="https://raw.githubusercontent.com/aframevr/sample-assets/master/assets/images/space/earth_atmos_2048.jpg"
          crossorigin="anonymous"
        />
        <img
          id="sky-texture"
          src="https://cdn.aframe.io/a-painter/images/sky.jpg"
          crossorigin="anonymous"
        />
      </a-assets>

      <a-sky src="#sky-texture"></a-sky>

      <a-sphere
        id="earth-object"
        position="0 1.5 -4"
        radius="1.2"
        src="#earth-texture"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 20000; easing: linear"
      >
      </a-sphere>

      <a-light type="ambient" color="#fff"></a-light>
      <a-light type="directional" position="-1 1 1" intensity="0.8"></a-light>

      <a-entity id="rig" position="0 0 0">
        <a-camera id="camera" look-controls position="0 1.6 0"></a-camera>

        <a-entity laser-controls="hand: left"></a-entity>
        <a-entity laser-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
